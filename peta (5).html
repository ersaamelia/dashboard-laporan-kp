          .map-layer-row input {

          }
          .map-layer-row label {cursor:pointer;flex:1}
          .layer-section {border-top:1px solid #e1e6ee;padding:5px 0 9px}
          .section-toggle {
            border:0;background:transparent;cursor:pointer;font-size:17px;
            width:20px;padding:0;color:#14213d;font-weight:bold;
          }
          .section-icon {font-size:20px;width:25px;text-align:center}
          .layer-dot {width:17px;height:17px;border-radius:50%;display:inline-block;flex:none}
          .layer-line {width:48px;height:5px;border-radius:8px;display:inline-block;flex:none}
          .map-layer-panel.collapsed .panel-body {display:none}
          @media(max-width:600px) {
            .map-layer-panel {width:min(310px,calc(100vw - 24px));right:8px;top:8px}

          var mapLayers = {};

            };
            leafletMap = map_7f18175b11dc7f7a5ad0d89524ef544b;
          });

          function togglePanel() {
            const panel=document.getElementById('mapLayerPanel');
            panel.classList.toggle('collapsed');
            document.getElementById('panelChevron').textContent =
              panel.classList.contains('collapsed') ? '⌄' : '⌃';
          }
          function toggleSection(id,button) {
            const el=document.getElementById(id);
            const hidden=el.style.display==='none';
            el.style.display=hidden?'block':'none';
            button.textContent=hidden?'⌄':'›';
          }
          function toggleOne(key,checked) {
            const layer=mapLayers[key]; if(!layer)return;
            if(checked)leafletMap.addLayer(layer);else leafletMap.removeLayer(layer);
            syncLayerChecks();
          }
          function toggleGroup(prefix,checked) {
            Object.keys(mapLayers).filter(k=>k.startsWith(prefix+'_')).forEach(k=>{
              if(checked)leafletMap.addLayer(mapLayers[k]);else leafletMap.removeLayer(mapLayers[k]);
            });
            document.querySelectorAll('.'+prefix+'-check').forEach(el=>el.checked=checked);
            syncLayerChecks();
          }
          function toggleAllLayers(checked) {
            Object.keys(mapLayers).forEach(k=>{
              if(checked)leafletMap.addLayer(mapLayers[k]);else leafletMap.removeLayer(mapLayers[k]);
            });
            document.querySelectorAll('.station-check,.route-check').forEach(el=>el.checked=checked);
            document.getElementById('stationMaster').checked=checked;
            document.getElementById('routeMaster').checked=checked;
          }
          function syncLayerChecks() {
            const st=[...document.querySelectorAll('.station-check')];
            const rt=[...document.querySelectorAll('.route-check')];
            const sa=st.every(el=>el.checked), ra=rt.every(el=>el.checked);
            document.getElementById('stationMaster').checked=sa;
            document.getElementById('routeMaster').checked=ra;
            document.getElementById('allLayers').checked=sa&&ra;
          }
        </script>
